name: Atualizacao de Dados

on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * 1"

jobs:
  refresh-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Atualizar timestamp de referencia
        run: |
          mkdir -p _data
          echo "ultima_atualizacao: $(date +%F)" > _data/data_status.yml

      - name: Commit se houver mudancas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _data/data_status.yml
          git diff --cached --quiet || git commit -m "chore: atualiza estado de dados"
          git push
