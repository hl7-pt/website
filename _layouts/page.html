---
layout: default
---
<section class="page-header container">
    <h1>{{ page.title }}</h1>
    {% if page.intro %}
    <p class="lead">{{ page.intro }}</p>
    {% endif %}
</section>

<section class="container page-content">
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "BreadcrumbList",
      "itemListElement": [
        {
          "@type": "ListItem",
          "position": 1,
          "name": "Início",
          "item": "https://hl7-pt.github.io/"
        },
        {
          "@type": "ListItem",
          "position": 2,
          "name": {{ page.title | jsonify }},
          "item": "https://hl7-pt.github.io{{ page.url }}"
        }
      ]
    }
    </script>
    {{ content }}
</section>
