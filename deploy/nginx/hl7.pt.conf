# Nginx virtual host for hl7.pt
# - Main site proxied from GitHub Pages
# - /fhir served locally from a cloned repository
#
# Before using in production:
# 1) Update ssl_certificate and ssl_certificate_key paths.
# 2) Ensure /var/www/hl7.pt/fhir exists and contains the FHIR site.
# 3) Point DNS A record for hl7.pt to this server.

server {
    listen 80;
    listen [::]:80;
    server_name hl7.pt www.hl7.pt;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    return 301 https://hl7.pt$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name hl7.pt www.hl7.pt;

    ssl_certificate     /etc/letsencrypt/live/hl7.pt/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hl7.pt/privkey.pem;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Ensure /fhir redirects to /fhir/
    location = /fhir {
        return 301 /fhir/;
    }

    # Serve local FHIR content while keeping URL under hl7.pt/fhir/
    location ^~ /fhir/ {
        alias /var/www/hl7.pt/fhir/;
        index index.html;
        try_files $uri $uri/ /fhir/index.html;
    }

    # Proxy all remaining routes to GitHub Pages
    location / {
        proxy_pass https://hl7-pt.github.io;
        proxy_ssl_server_name on;

        proxy_set_header Host hl7-pt.github.io;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
}
